name: Delete old releases (one-time cleanup)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases except the 8 kept tags
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: quychh123/hq-apple-releases
        run: |
          set -uo pipefail
          KEEP="windows-1.2-v214 hq-apple-apk-hoanchinh-v271 kho-hang-mini-win-v49 kho-hang-mini-apk-v66 windows-capnhat-chung-v1 trung-tam-cap-nhat-v3.0.5 apk-capnhat-chung-v1 ipa-1.2"
          is_kept() { for k in $KEEP; do [ "$1" = "$k" ] && return 0; done; return 1; }
          echo "== releases before =="
          gh api "repos/$REPO/releases?per_page=100" --paginate -q '.[] | [.id, .tag_name] | @tsv' > /tmp/releases.tsv
          wc -l /tmp/releases.tsv
          deleted=0; kept=0; failed=0
          while IFS="$(printf '\t')" read -r id tag; do
            if is_kept "$tag"; then echo "KEEP $tag"; kept=$((kept+1)); continue; fi
            echo "DELETE release $tag (id $id)"
            if gh api -X DELETE "repos/$REPO/releases/$id" --silent; then deleted=$((deleted+1)); else echo "FAILED release $tag"; failed=$((failed+1)); fi
          done < /tmp/releases.tsv
          echo "kept=$kept deleted=$deleted failed=$failed"
          echo "== leftover tags =="
          gh api "repos/$REPO/tags?per_page=100" --paginate -q '.[] | .name' > /tmp/tags.txt
          wc -l /tmp/tags.txt
          tagdel=0; tagkeep=0; tagfail=0
          while IFS= read -r tag; do
            if is_kept "$tag"; then tagkeep=$((tagkeep+1)); continue; fi
            echo "DELETE tag $tag"
            if gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" --silent; then tagdel=$((tagdel+1)); else echo "FAILED tag $tag"; tagfail=$((tagfail+1)); fi
          done < /tmp/tags.txt
          echo "tagkeep=$tagkeep tagdeleted=$tagdel tagfailed=$tagfail"
          echo "== releases after =="
          gh api "repos/$REPO/releases?per_page=100" --paginate -q '.[] | .tag_name'
